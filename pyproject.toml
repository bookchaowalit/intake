[project]
name = "solo-intake"
version = "0.1.0"
description = "Intake cell: its own API and database (made with solo-cell-kit)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1.4"]

[project.scripts]
intake-api = "cellkit.server:api"
intake-publish = "cellkit.server:run_publish"
intake-db = "cellkit.server:run_db"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
